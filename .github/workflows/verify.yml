name: Vérification

# Sur chaque branche et chaque pull request : un défaut vu après la fusion
# coûte plus cher qu'un défaut vu avant. Le déploiement reste géré par
# `deploy.yml`, qui ne se déclenche que sur main.
on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  backend:
    name: Backend — types, lint et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

      # `npm run lint` corrige les fichiers : en vérification, on veut
      # constater l'état du dépôt, pas le modifier.
      - run: npx eslint src

      - run: npm test

  frontend:
    name: Frontend — types, lint et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src
      - run: npm test

  accessibilite:
    name: Accessibilité — audit RGAA (US-28)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # L'audit porte sur le bundle servi aux visiteurs, pas sur le serveur de
      # développement : c'est le premier qui doit être accessible.
      - run: npm run build

      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Audit axe-core
        run: npm run test:a11y

      # Conservé même en cas d'échec : c'est précisément alors que le rapport
      # sert à savoir quelle règle a cédé et sur quel élément.
      - name: Rapport d'audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-accessibilite
          path: frontend/playwright-report/
          retention-days: 14
